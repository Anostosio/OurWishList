    .top-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}button{cursor:pointer;font:inherit}.theme-chip,.add-btn,.pager button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 12px;transition:.18s ease}.theme-chip{border-radius:999px;font-weight:600;white-space:nowrap}.add-btn{border-color:var(--accent-strong);background:linear-gradient(180deg,color-mix(in oklab,var(--accent) 88%,white),color-mix(in oklab,var(--accent-strong) 84%,white));color:#fff;font-weight:700}button:focus{outline:none;box-shadow:0 0 0 3px var(--ring)}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 10px}.tab{border:1px solid var(--line);background:var(--surface-soft);color:var(--muted);border-radius:14px;padding:11px 8px;font-weight:650;min-width:0;transition:.18s ease}.tab.active{background:linear-gradient(180deg,color-mix(in oklab,var(--accent) 86%,white),var(--accent));border-color:var(--accent-strong);color:#152013;box-shadow:0 7px 18px color-mix(in oklab,var(--accent) 20%,transparent)}
    .status-wrap{border:1px dashed var(--line);border-radius:12px;padding:9px 11px;color:var(--muted);background:var(--accent-soft);font-size:13px}.status{min-height:20px;display:flex;align-items:center;gap:8px}.dot{width:9px;aspect-ratio:1;border-radius:50%;background:var(--accent);display:none;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.22)}}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.card{border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-soft)}.mediaWrap{position:relative;background:linear-gradient(135deg,#ddecc0,#f6ffef);aspect-ratio:4/3}.photo{width:100%;height:100%;display:block;object-fit:cover;border-bottom:1px solid var(--line)}.photo-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);background:linear-gradient(135deg,var(--surface-soft),var(--accent-soft));border-bottom:1px solid var(--line)}

on:0 50%}}@media(max-width:620px){.page{padding:8px}.brand{align-items:flex-start}.brand p{margin-left:50px}.brand-logo{font-size:24px;gap:9px}.brand-logo .mark{width:42px;height:42px;flex-basis:42px}.top-actions{gap:6px}.add-btn{padding:9px 10px}.tabs{grid-template-columns:repeat(2,1fr)}}

<body>
  <div class="page">
    <header>
      <div class="brand">
        <div class="brand-left">
          <h1 class="brand-logo" aria-label="OurWishList"><span class="mark" aria-hidden="true"><span class="mark-tail"></span></span><span>Our<span class="wish">Wish</span>List</span></h1>
          <p>Желания, которые сближают</p>
        </div>
        <div class="top-actions"><button id="themeChip" class="theme-chip" type="button">☀️ Светлая</button><button id="addWish" class="add-btn" type="button">＋ Добавить</button></div>
      </div>
      <nav class="tabs" aria-label="Списки желаний"><button class="tab active" data-kind="mine">♡ Моё</button><button class="tab" data-kind="partner">♧ Партнёра</button><button class="tab" data-kind="shared">⌂ Общее</button><button class="tab" data-kind="archive">✓ Сбылось</button></nav>
      <div class="status-wrap"><div class="status" id="status"><span class="dot" id="loaderDot"></span><span>Готовимся к загрузке…</span></div></div>
    </header>
    <main class="grid" id="cards"></main>
    <div class="pager"><button id="prev">← Назад</button><button id="next">Вперёд →</button></div>
    <div class="footer">Сделано с 💚 для нас</div>
  </div>
<script>
const query=new URLSearchParams(location.search),session=query.get('session'),apiBase=(query.get('api')||'').replace(/\/$/,''),botLink=query.get('bot')||'';const state={kind:'mine',page:0,limit:12};const nodes={status:document.getElementById('status'),cards:document.getElementById('cards'),prev:document.getElementById('prev'),next:document.getElementById('next'),loaderDot:document.getElementById('loaderDot'),addWish:document.getElementById('addWish'),themeChip:document.getElementById('themeChip'),tabs:[...document.querySelectorAll('.tab')]};
function tryStorageGet(k){try{return localStorage.getItem(k)}catch{return null}}function tryStorageSet(k,v){try{localStorage.setItem(k,v)}catch{}}function setTheme(theme){const mode=theme==='dark'?'dark':'light';document.documentElement.setAttribute('data-theme',mode);nodes.themeChip.textContent=mode==='dark'?'🌙 Тёмная':'☀️ Светлая';tryStorageSet('wishlist_theme',mode)}setTheme(tryStorageGet('wishlist_theme')||((window.Telegram?.WebApp?.colorScheme==='dark')?'dark':'light'));nodes.themeChip.addEventListener('click',()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
function setStatus(t){nodes.status.querySelector('span:last-child').textContent=t}function setLoading(on){nodes.loaderDot.style.display=on?'inline-block':'none';nodes.prev.disabled=on||!session;nodes.next.disabled=on||!session;nodes.addWish.disabled=on||!session;nodes.tabs.forEach(b=>b.disabled=on||!session)}function setActiveKind(k){state.kind=k;nodes.tabs.forEach(b=>b.classList.toggle('active',b.dataset.kind===k))}function showPlaceholder(){nodes.cards.innerHTML='';for(let i=0;i<3;i++){const e=document.createElement('div');e.className='skeleton';nodes.cards.appendChild(e)}}function matchModeText(v){return v==='exact'?'Именно это':v==='alternative'?'Можно аналог':'Вариант не уточнён'}
function createEmptyState(){const w=document.createElement('div');w.className='empty-state';w.innerHTML='<div class="empty-visual" aria-hidden="true"></div><strong>Пока ничего не найдено</strong><div>Здесь появятся ваши желания.</div>';const add=document.createElement('button');add.className='add-btn empty-add';add.textContent='＋ Добавить желание';add.addEventListener('click',openAddWish);w.appendChild(add);return w}
function renderCard(card){const item=document.createElement('article');item.className='card';const media=document.createElement('div');media.className='mediaWrap';if(card.image&&!card.image.startsWith('tg:')){const img=document.createElement('img');img.className='photo';img.loading='lazy';img.src=card.image;img.alt=card.title||'Изображение';media.appendChild(img)}else{const ph=document.createElement('div');ph.className='photo-placeholder';ph.textContent='Нет фото';media.appendChild(ph)}const scope=document.createElement('span');scope.className='scopeBadge';scope.textContent=card.scope==='shared'?'Для нас':card.isOwner?'Моё':'Партнёра';media.appendChild(scope);if(card.price){const price=document.createElement('span');price.className='priceStamp';price.textContent=card.price;media.appendChild(price)}const body=document.createElement('div');body.className='body';const title=document.createElement('h2');title.textContent=card.title||'Без названия';const owner=document.createElement('div');owner.className='muted';owner.textContent=card.ownerName?`Автор: ${card.ownerName}`:'';const meta=document.createElement('div');meta.className='meta';for(const txt of [card.priority===2?'❤️ Очень хочу':card.priority===1?'💛 Хочу':'🌱 Когда-нибудь',card.category||''].filter(Boolean)){const c=document.createElement('span');c.className='chip';c.textContent=txt;meta.appendChild(c)}const details=document.createElement('div');details.className='details';details.innerHTML=`<div><strong>Характеристики:</strong> ${[card.size,card.color].filter(Boolean).join(' · ')||'не указаны'}</div><div><strong>Подойдёт:</strong> ${matchModeText(card.matchMode||'unspecified')}</div>`;const note=document.createElement('p');note.className='note';note.textContent=card.note||'Комментарий не добавлен';const more=document.createElement('button');more.textContent='Подробнее';more.addEventListener('click',()=>loadDetail(card.id,note,more));body.append(title,owner,meta,details,note,more);const actions=document.createElement('div');actions.className='actions';if(card.url){const a=document.createElement('a');a.href=card.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Открыть магазин';actions.appendChild(a)}const badge=document.createElement('button');badge.className='stateBadge';badge.textContent=card.archived?'В архиве':'В списке';actions.appendChild(badge);item.append(media,body,actions);return item}
async function loadDetail(id,note,button){const base=apiBase||`${location.origin}/api`;try{const r=await fetch(`${base}/wish/${id}?session=${encodeURIComponent(session)}`);const d=await r.json();if(r.ok&&d.ok){note.textContent=d.card.note||'Комментарий не добавлен';note.classList.add('expanded');button.style.display='none'}}catch{}}
function openAddWish(){if(botLink&&window.Telegram?.WebApp?.openTelegramLink)return window.Telegram.WebApp.openTelegramLink(botLink);if(botLink){location.href=botLink;return}alert('Откройте бота и отправьте ссылку или текст для добавления желания.')}nodes.addWish.addEventListener('click',openAddWish);
async function requestWishlist(){if(!session){setStatus('Сначала откройте приложение через кнопку в боте.');return}setLoading(true);setStatus('Загружаю список…');showPlaceholder();const params=new URLSearchParams({session,kind:state.kind,category:'',query:'',budget:'',sort:'priority',page:String(state.page),limit:String(state.limit)});const base=apiBase||`${location.origin}/api`;try{const r=await fetch(`${base}/wishlist?${params}`);const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Ошибка загрузки');nodes.cards.innerHTML='';nodes.prev.disabled=d.page===0;nodes.next.disabled=!d.hasMore;if(!d.cards.length)nodes.cards.appendChild(createEmptyState());else d.cards.forEach(c=>nodes.cards.appendChild(renderCard(c)));setStatus(`Найдено: ${d.count} · Страница ${d.page+1}`)}catch(e){nodes.cards.innerHTML='';nodes.cards.appendChild(createEmptyState());setStatus(e.message||'Не удалось загрузить список')}finally{setLoading(false)}}
nodes.tabs.forEach(btn=>btn.addEventListener('click',()=>{setActiveKind(btn.dataset.kind);state.page=0;requestWishlist()}));nodes.prev.addEventListener('click',()=>{if(state.page>0){state.page--;requestWishlist()}});nodes.next.addEventListener('click',()=>{state.page++;requestWishlist()});try{window.Telegram?.WebApp?.ready?.();window.Telegram?.WebApp?.expand?.()}catch{}if(session)requestWishlist();else setStatus('Сначала откройте приложение через кнопку в боте.');
</script>
</body>
</html>
