<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OurWishList</title>
<style>
:root,[data-theme="light"]{--bg:#f4f9ec;--surface:#fff;--surface-soft:#f8fbf1;--line:#d8e5be;--text:#1a241a;--muted:#5f6d54;--muted-soft:#7b896e;--accent:#91c65f;--accent-strong:#7ab34d;--accent-soft:rgba(145,198,95,.18);--shadow:0 16px 40px rgba(67,91,38,.12);--shadow-soft:0 10px 24px rgba(67,91,38,.12);--ring:rgba(145,198,95,.25);--page-max:1020px}
[data-theme="dark"]{--bg:#151c1a;--surface:#1c2523;--surface-soft:#1f2927;--line:#2d3a35;--text:#eaf4ea;--muted:#9fb2a6;--muted-soft:#82958a;--accent:#8fcd70;--accent-strong:#73b85a;--accent-soft:rgba(143,205,112,.2);--shadow:0 16px 40px rgba(0,0,0,.35);--shadow-soft:0 10px 24px rgba(0,0,0,.2);--ring:rgba(143,205,112,.25)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at top,#d8e7b8,var(--bg) 55%);min-height:100vh;overflow-x:hidden}[data-theme="dark"] body{background:radial-gradient(circle at top,#24352c,var(--bg) 55%)}
.page{max-width:var(--page-max);margin:0 auto;padding:16px;display:grid;gap:14px}
header{position:sticky;top:8px;z-index:2;padding:14px;border:1px solid var(--line);border-radius:18px;background:color-mix(in oklab,var(--surface) 78%,transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow-soft)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px}.brand-left{min-width:0}
.brand-logo{display:inline-flex;align-items:center;gap:11px;margin:0;color:var(--text);white-space:nowrap;font-size:clamp(29px,4.6vw,35px);line-height:1;letter-spacing:-1.15px;font-weight:780}
.brand-icon{width:58px;height:58px;object-fit:contain;display:block;flex:0 0 58px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.14))}
.brand-logo .wish{color:var(--accent-strong)}.brand p{margin:7px 0 0 70px;color:var(--muted);font-size:14px;letter-spacing:.1px}
.top-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
button{cursor:pointer;font:inherit}.theme-chip,.add-btn,.pager button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 12px;transition:.18s ease}
.theme-chip{border-radius:999px;font-weight:600;white-space:nowrap}.add-btn{border-color:var(--accent-strong);background:linear-gradient(180deg,color-mix(in oklab,var(--accent) 88%,white),color-mix(in oklab,var(--accent-strong) 84%,white));color:#fff;font-weight:700}
button:focus{outline:none;box-shadow:0 0 0 3px var(--ring)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:8px 0 12px}.tab{border:1px solid var(--line);background:var(--surface-soft);color:var(--muted);border-radius:15px;padding:13px 8px;font-size:14px;font-weight:680;min-width:0;transition:.18s ease;white-space:nowrap}.tab.active{background:linear-gradient(180deg,color-mix(in oklab,var(--accent) 86%,white),var(--accent));border-color:var(--accent-strong);color:#152013;box-shadow:0 7px 18px color-mix(in oklab,var(--accent) 20%,transparent)}
.status-wrap{border:1px dashed var(--line);border-radius:12px;padding:9px 11px;color:var(--muted);background:var(--accent-soft);font-size:13px}.status{min-height:20px;display:flex;align-items:center;gap:8px}.dot{width:9px;aspect-ratio:1;border-radius:50%;background:var(--accent);display:none;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.22)}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-soft)}.mediaWrap{position:relative;background:linear-gradient(135deg,#ddecc0,#f6ffef);aspect-ratio:4/3}.photo{width:100%;height:100%;display:block;object-fit:cover;border-bottom:1px solid var(--line)}.photo-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);background:linear-gradient(135deg,var(--surface-soft),var(--accent-soft));border-bottom:1px solid var(--line)}
.scopeBadge,.priceStamp{position:absolute;top:10px;padding:5px 8px;border-radius:999px;background:color-mix(in oklab,var(--surface) 82%,transparent);border:1px solid var(--line);font-size:12px;backdrop-filter:blur(3px)}.scopeBadge{left:10px}.priceStamp{right:10px;color:var(--accent-strong);font-weight:700}
.body{padding:11px}.body h2{margin:0 0 6px;font-size:17px}.muted{color:var(--muted);font-size:13px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);color:var(--muted-soft);border-radius:999px;padding:4px 8px;font-size:12px}.details{display:grid;gap:6px;margin-bottom:8px;border-left:2px solid var(--line);padding-left:8px}.details div{font-size:13px;color:var(--muted-soft)}.details strong{color:var(--text)}.note{margin:4px 0 0;max-height:66px;overflow:hidden;white-space:pre-wrap}.note.expanded{max-height:none}
.actions{display:flex;gap:6px;padding:0 10px 10px;flex-wrap:wrap}.actions a,.actions button{border:1px solid var(--line);border-radius:8px;background:var(--surface-soft);color:var(--text);text-decoration:none;padding:6px 8px;font-size:12px}.stateBadge{margin-left:auto;pointer-events:none;color:var(--muted)!important}
.empty-state{padding:54px 22px 48px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--muted);text-align:center;grid-column:1/-1;box-shadow:var(--shadow-soft)}.empty-art{width:220px;max-width:58vw;height:auto;display:block;margin:0 auto 20px;object-fit:contain;filter:drop-shadow(0 14px 28px rgba(0,0,0,.12))}.empty-state strong{display:block;font-size:22px;color:var(--text);margin-bottom:9px;letter-spacing:-.2px}.empty-state .empty-add{margin-top:20px;padding:12px 18px;border-radius:13px}
.pager{position:sticky;bottom:6px;display:flex;gap:10px}.pager button{flex:1;min-height:40px}.pager button[disabled]{opacity:.45;cursor:not-allowed}.footer{text-align:center;color:var(--muted-soft);font-size:12px;padding:4px 0 10px}
.skeleton{border-radius:14px;border:1px dashed var(--line);min-height:210px;background:linear-gradient(90deg,var(--accent-soft) 25%,color-mix(in oklab,var(--accent-soft) 60%,white) 37%,var(--accent-soft) 63%);background-size:400% 100%;animation:shimmer 1.2s ease infinite;grid-column:1/-1}@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(max-width:620px){.page{padding:8px}.brand{align-items:center}.brand-logo{font-size:27px;gap:9px}.brand-icon{width:50px;height:50px;flex-basis:50px}.brand p{margin-left:59px;font-size:12px}.top-actions{gap:6px}.theme-chip,.add-btn{padding:9px 10px;font-size:13px}.tabs{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.tab{padding:10px 4px;font-size:12px;border-radius:12px}.empty-art{width:190px;max-width:62vw}}
</style>
</head>
<body>
<div class="page">
<header>
<div class="brand">
<div class="brand-left">
<h1 class="brand-logo" aria-label="OurWishList">
<img class="brand-icon" alt="" aria-hidden="true" src="assets/logo_mark.png?v=4">
<span>Our<span class="wish">Wish</span>List</span>
</h1>
<p>Желания, которые сближают</p>
</div>
<div class="top-actions">
<button id="themeChip" class="theme-chip" type="button">☀️ Светлая</button>
<button id="addWish" class="add-btn" type="button">＋ Добавить</button>
</div>
</div>
<nav class="tabs" aria-label="Списки желаний">
<button class="tab active" data-kind="mine">Моё</button>
<button class="tab" data-kind="partner">Партнёра</button>
<button class="tab" data-kind="shared">Общее</button>
<button class="tab" data-kind="archive">Сбылось</button>
</nav>
<div class="status-wrap"><div class="status" id="status"><span class="dot" id="loaderDot"></span><span>Готовимся к загрузке…</span></div></div>
</header>
<main class="grid" id="cards"></main>
<div class="pager"><button id="prev">← Назад</button><button id="next">Вперёд →</button></div>
<div class="footer">Сделано с 💚 для нас</div>
</div>
<script>
const query=new URLSearchParams(location.search),session=query.get('session'),apiBase=(query.get('api')||'').replace(/\/$/,''),botLink=query.get('bot')||'';
const state={kind:'mine',page:0,limit:12};
const nodes={status:document.getElementById('status'),cards:document.getElementById('cards'),prev:document.getElementById('prev'),next:document.getElementById('next'),loaderDot:document.getElementById('loaderDot'),addWish:document.getElementById('addWish'),themeChip:document.getElementById('themeChip'),tabs:[...document.querySelectorAll('.tab')]};
function tryStorageGet(k){try{return localStorage.getItem(k)}catch{return null}}function tryStorageSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function setTheme(theme){const mode=theme==='dark'?'dark':'light';document.documentElement.setAttribute('data-theme',mode);nodes.themeChip.textContent=mode==='dark'?'🌙 Тёмная':'☀️ Светлая';tryStorageSet('wishlist_theme',mode)}
setTheme(tryStorageGet('wishlist_theme')||((window.Telegram?.WebApp?.colorScheme==='dark')?'dark':'light'));
nodes.themeChip.addEventListener('click',()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
function setStatus(t){nodes.status.querySelector('span:last-child').textContent=t}function setLoading(on){nodes.loaderDot.style.display=on?'inline-block':'none';nodes.prev.disabled=on||!session;nodes.next.disabled=on||!session;nodes.addWish.disabled=on||!session;nodes.tabs.forEach(b=>b.disabled=on||!session)}function setActiveKind(k){state.kind=k;nodes.tabs.forEach(b=>b.classList.toggle('active',b.dataset.kind===k))}
function showPlaceholder(){nodes.cards.innerHTML='';for(let i=0;i<3;i++){const e=document.createElement('div');e.className='skeleton';nodes.cards.appendChild(e)}}
function createEmptyState(){const w=document.createElement('div');w.className='empty-state';w.innerHTML='<img class="empty-art" alt="" aria-hidden="true" src="assets/empty_box.png?v=4"><strong>Пока ничего не найдено</strong><div>Здесь появятся ваши желания.</div>';const add=document.createElement('button');add.className='add-btn empty-add';add.textContent='＋ Добавить желание';add.addEventListener('click',openAddWish);w.appendChild(add);return w}
function renderCard(card){const item=document.createElement('article');item.className='card';const media=document.createElement('div');media.className='mediaWrap';if(card.image&&!card.image.startsWith('tg:')){const img=document.createElement('img');img.className='photo';img.loading='lazy';img.src=card.image;img.alt=card.title||'Изображение';media.appendChild(img)}else{const ph=document.createElement('div');ph.className='photo-placeholder';ph.textContent='Нет фото';media.appendChild(ph)}const sc=document.createElement('span');sc.className='scopeBadge';sc.textContent=card.scope==='shared'?'Для нас':(card.isOwner?'Моё':'Партнёру');media.appendChild(sc);if(card.price){const ps=document.createElement('span');ps.className='priceStamp';ps.textContent=card.price;media.appendChild(ps)}const body=document.createElement('div');body.className='body';const title=document.createElement('h2');title.textContent=card.title||'Без названия';const owner=document.createElement('p');owner.className='muted';owner.textContent=card.ownerName?`Автор: ${card.ownerName}`:'';const meta=document.createElement('div');meta.className='meta';for(const txt of [card.priority===2?'❤️ Очень хочу':card.priority===1?'💛 Хочу':'🌱 Когда-нибудь',card.category||''].filter(Boolean)){const c=document.createElement('span');c.className='chip';c.textContent=txt;meta.appendChild(c)}const details=document.createElement('div');details.className='details';details.innerHTML=`<div><strong>Характеристики:</strong> ${[card.size,card.color].filter(Boolean).join(' · ')||'не указаны'}</div><div><strong>Подойдёт:</strong> ${card.matchMode==='exact'?'Именно это':card.matchMode==='alternative'?'Можно аналог':'Вариант не уточнён'}</div>`;const note=document.createElement('p');note.className='note';note.textContent=card.note||'Комментарий не добавлен';const more=document.createElement('button');more.textContent='Подробнее';more.addEventListener('click',async()=>{const base=apiBase||`${window.location.origin}/api`;try{const r=await fetch(`${base}/wish/${card.id}?session=${encodeURIComponent(session)}`),d=await r.json();if(r.ok&&d.ok){note.textContent=d.card.note||'Комментарий не добавлен';note.classList.add('expanded');more.style.display='none'}}catch{}});body.append(title,owner,meta,details,note,more);const actions=document.createElement('div');actions.className='actions';if(card.url){const a=document.createElement('a');a.href=card.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Открыть магазин';actions.appendChild(a)}const badge=document.createElement('button');badge.className='stateBadge';badge.textContent=card.archived?'В архиве':'В списке';actions.appendChild(badge);item.append(media,body,actions);return item}
async function requestWishlist(){if(!session)return;setLoading(true);setStatus('Загружаю список…');showPlaceholder();const base=apiBase||`${window.location.origin}/api`,params=new URLSearchParams({session,kind:state.kind,page:String(state.page),limit:String(state.limit)});try{const r=await fetch(`${base}/wishlist?${params}`),d=await r.json();nodes.cards.innerHTML='';if(!r.ok||!d.ok){setStatus(d.error||'Не удалось загрузить список');nodes.cards.appendChild(createEmptyState());return}setStatus(`Страница ${d.page+1} · Найдено ${d.count}`);nodes.prev.disabled=d.page===0;nodes.next.disabled=!d.hasMore;if(!d.cards.length)nodes.cards.appendChild(createEmptyState());else d.cards.forEach(c=>nodes.cards.appendChild(renderCard(c)))}catch{setStatus('Нет доступа к API');nodes.cards.innerHTML='';nodes.cards.appendChild(createEmptyState())}finally{setLoading(false)}
function openAddWish(){if(botLink&&window.Telegram?.WebApp?.openTelegramLink)return window.Telegram.WebApp.openTelegramLink(botLink);if(botLink)location.href=botLink;else alert('Откройте бота и отправьте ссылку или текст.')}
nodes.tabs.forEach(b=>b.addEventListener('click',()=>{setActiveKind(b.dataset.kind);state.page=0;requestWishlist()}));nodes.prev.addEventListener('click',()=>{if(state.page>0){state.page--;requestWishlist()}});nodes.next.addEventListener('click',()=>{state.page++;requestWishlist()});nodes.addWish.addEventListener('click',openAddWish);
try{window.Telegram?.WebApp?.ready?.();window.Telegram?.WebApp?.expand?.()}catch{}
if(session)requestWishlist();else{setStatus('Сначала откройте приложение через кнопку в боте.');setLoading(false)}
</script>
</body>
</html>
