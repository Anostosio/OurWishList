<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OurWishList</title>
<style>
:root,[data-theme="light"]{--bg:#f4f9ec;--surface:#fff;--surface-soft:#f8fbf1;--line:#d8e5be;--text:#1a241a;--muted:#5f6d54;--muted-soft:#7b896e;--accent:#91c65f;--accent-strong:#7ab34d;--accent-soft:rgba(145,198,95,.18);--shadow:0 16px 40px rgba(67,91,38,.12);--shadow-soft:0 10px 24px rgba(67,91,38,.12);--ring:rgba(145,198,95,.25);--page-max:1020px}
[data-theme="dark"]{--bg:#151c1a;--surface:#1c2523;--surface-soft:#1f2927;--line:#2d3a35;--text:#eaf4ea;--muted:#9fb2a6;--muted-soft:#82958a;--accent:#8fcd70;--accent-strong:#73b85a;--accent-soft:rgba(143,205,112,.2);--shadow:0 16px 40px rgba(0,0,0,.35);--shadow-soft:0 10px 24px rgba(0,0,0,.2);--ring:rgba(143,205,112,.25)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at top,#d8e7b8,var(--bg) 55%);min-height:100vh;overflow-x:hidden}[data-theme="dark"] body{background:radial-gradient(circle at top,#24352c,var(--bg) 55%)}
.page{width:100%;max-width:var(--page-max);min-width:0;margin:0 auto;padding:16px;display:grid;gap:14px}.page>*,.brand,.top-actions,.tabs,.grid,.pager{min-width:0}
header{position:sticky;top:8px;z-index:2;padding:14px;border:1px solid var(--line);border-radius:18px;background:color-mix(in oklab,var(--surface) 78%,transparent);backdrop-filter:blur(10px);box-shadow:var(--shadow-soft)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px}.brand-left{min-width:0}
.brand-lockup{display:block;width:min(360px,100%);height:auto;border-radius:8px}
.top-actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
button{cursor:pointer;font:inherit}.theme-chip,.add-btn,.pager button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:10px 12px;transition:.18s ease}
.theme-chip{border-radius:999px;font-weight:600;white-space:nowrap}.add-btn{border-color:var(--accent-strong);background:linear-gradient(180deg,color-mix(in oklab,var(--accent) 88%,white),color-mix(in oklab,var(--accent-strong) 84%,white));color:#fff;font-weight:700}
button:focus{outline:none;box-shadow:0 0 0 3px var(--ring)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:8px 0 12px}.tab{border:1px solid var(--line);background:var(--surface-soft);color:var(--muted);border-radius:15px;padding:13px 8px;font-size:14px;font-weight:680;min-width:0;transition:.18s ease;white-space:nowrap}.tab.active{background:linear-gradient(180deg,color-mix(in oklab,var(--accent) 86%,white),var(--accent));border-color:var(--accent-strong);color:#152013;box-shadow:0 7px 18px color-mix(in oklab,var(--accent) 20%,transparent)}
.status-wrap{border:1px dashed var(--line);border-radius:12px;padding:9px 11px;color:var(--muted);background:var(--accent-soft);font-size:13px}.status{min-height:20px;display:flex;align-items:center;gap:8px}.dot{width:9px;aspect-ratio:1;border-radius:50%;background:var(--accent);display:none;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.22)}}
.filter-menu{margin-top:10px;border:1px solid var(--line);border-radius:13px;background:var(--surface-soft);overflow:hidden}.filter-menu summary{cursor:pointer;list-style:none;padding:10px 12px;font-weight:650;color:var(--muted)}.filter-menu summary::-webkit-details-marker{display:none}.filter-menu summary::after{content:'⌄';float:right}.filter-menu[open] summary::after{content:'⌃'}.filter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:0 11px 11px}.filter-grid input,.filter-grid select{width:100%;min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--text);padding:10px;font:inherit}.filter-grid .filter-search{grid-column:1/-1}.filter-actions{grid-column:1/-1;display:flex;gap:9px}.filter-actions button{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--surface);color:var(--text)}.filter-actions .apply-filter{border-color:var(--accent-strong);background:var(--accent);color:#152013;font-weight:700}
.pair-banner{display:none;margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--surface-soft);color:var(--muted);font-size:13px;line-height:1.4}.pair-banner.visible{display:block}.pair-banner strong{display:block;color:var(--text);font-size:14px;margin-bottom:3px}.pair-actions{display:flex;gap:8px;margin-top:9px}.pair-actions button{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--surface);color:var(--text);font-weight:650}.pair-actions .invite-primary{background:var(--accent);border-color:var(--accent-strong);color:#152013}.invite-link{display:none;width:100%;margin-top:9px;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--surface);color:var(--text);font:inherit;font-size:12px}.invite-link.visible{display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-soft)}.mediaWrap{position:relative;background:linear-gradient(135deg,#ddecc0,#f6ffef);aspect-ratio:4/3}.photo{width:100%;height:100%;display:block;object-fit:cover;border-bottom:1px solid var(--line)}.photo-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);background:linear-gradient(135deg,var(--surface-soft),var(--accent-soft));border-bottom:1px solid var(--line)}
.scopeBadge,.priceStamp{position:absolute;top:10px;padding:5px 8px;border-radius:999px;background:color-mix(in oklab,var(--surface) 82%,transparent);border:1px solid var(--line);font-size:12px;backdrop-filter:blur(3px)}.scopeBadge{left:10px}.priceStamp{right:10px;color:var(--accent-strong);font-weight:700}
.body{padding:11px}.body h2{margin:0 0 6px;font-size:17px}.muted{color:var(--muted);font-size:13px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);color:var(--muted-soft);border-radius:999px;padding:4px 8px;font-size:12px}.details{display:grid;gap:6px;margin-bottom:8px;border-left:2px solid var(--line);padding-left:8px}.details div{font-size:13px;color:var(--muted-soft)}.details strong{color:var(--text)}.note{margin:4px 0 0;max-height:66px;overflow:hidden;white-space:pre-wrap}.note.expanded{max-height:none}
.actions{display:flex;gap:6px;padding:0 10px 10px;flex-wrap:wrap}.actions a,.actions button{border:1px solid var(--line);border-radius:8px;background:var(--surface-soft);color:var(--text);text-decoration:none;padding:6px 8px;font-size:12px}.stateBadge{margin-left:auto;pointer-events:none;color:var(--muted)!important}
  .empty-state{padding:54px 22px 48px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--muted);text-align:center;grid-column:1/-1;box-shadow:var(--shadow-soft)}.empty-art{width:250px;max-width:68vw;height:auto;display:block;margin:0 auto 20px;border-radius:18px;filter:drop-shadow(0 14px 28px rgba(0,0,0,.12))}.empty-state strong{display:block;font-size:22px;color:var(--text);margin-bottom:9px;letter-spacing:-.2px}.empty-state .empty-copy{max-width:440px;margin:0 auto;line-height:1.55}.empty-state .empty-add{margin-top:20px;padding:12px 18px;border-radius:13px}
.pager{display:flex;gap:10px}.pager button{flex:1;min-height:40px}.pager button[disabled]{opacity:.45;cursor:not-allowed}.footer{text-align:center;color:var(--muted-soft);font-size:12px;padding:4px 0 10px}
.skeleton{border-radius:14px;border:1px dashed var(--line);min-height:210px;background:linear-gradient(90deg,var(--accent-soft) 25%,color-mix(in oklab,var(--accent-soft) 60%,white) 37%,var(--accent-soft) 63%);background-size:400% 100%;animation:shimmer 1.2s ease infinite;grid-column:1/-1}@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(max-width:620px){.page{padding:8px}.brand{align-items:center}.brand-left{width:min(245px,62vw)}.brand-lockup{width:100%}.top-actions{gap:6px}.theme-chip,.add-btn{padding:9px 10px;font-size:13px}.tabs{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.tab{padding:10px 4px;font-size:12px;border-radius:12px}.filter-grid,.field-row{grid-template-columns:1fr}.filter-grid .filter-search,.filter-actions{grid-column:1}.empty-art{width:220px;max-width:70vw}}
.add-modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(7,14,11,.58);backdrop-filter:blur(8px)}
.add-modal.open{display:flex}.add-sheet{width:min(520px,100%);max-height:calc(100vh - 28px);overflow:auto;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);padding:18px}.add-sheet h2{margin:0 0 14px;font-size:22px}.add-grid{display:grid;gap:10px}.add-grid input,.add-grid textarea,.add-grid select{width:100%;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface-soft);color:var(--text);padding:12px;font:inherit}.add-grid textarea{min-height:88px;resize:vertical}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.autofill-row{display:flex;align-items:center;gap:9px}.autofill-row button{flex:0 0 auto;border:1px solid var(--line);border-radius:11px;background:var(--surface-soft);color:var(--text);padding:10px 12px}.autofill-status{min-height:20px;color:var(--muted);font-size:12px;line-height:1.35}.product-preview{display:none;grid-template-columns:72px 1fr;gap:11px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:13px;background:var(--surface-soft)}.product-preview.visible{display:grid}.product-preview img{width:72px;height:72px;object-fit:cover;border-radius:10px;background:var(--accent-soft)}.product-preview strong{font-size:13px}.product-preview span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.add-row{display:flex;gap:10px;margin-top:14px}.add-row button{flex:1;border-radius:12px;padding:11px 12px}.ghost-btn{border:1px solid var(--line);background:var(--surface-soft);color:var(--text)}
@media(max-width:620px){.filter-grid,.field-row{grid-template-columns:1fr}.filter-grid .filter-search,.filter-actions{grid-column:1}}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="brand"><div class="brand-left"><img class="brand-lockup" src="assets/logo-exact.png?v=1" alt="OurWishList — Желания, которые сближают"></div><div class="top-actions"><button id="themeChip" class="theme-chip" type="button">☀️ Светлая</button><button id="addWish" class="add-btn" type="button">＋ Добавить</button></div></div>
<nav class="tabs" aria-label="Списки желаний"><button class="tab active" data-kind="mine">Моё</button><button class="tab" data-kind="partner">Партнёра</button><button class="tab" data-kind="shared">Общее</button><button class="tab" data-kind="archive">Сбылось</button></nav>
<div class="status" id="status" aria-live="polite" hidden><span class="dot" id="loaderDot"></span><span>Готовимся к загрузке…</span></div>
<section class="pair-banner" id="pairBanner" aria-live="polite"><strong>Пригласите партнёра</strong><span id="pairText">После подключения вы увидите желания друг друга.</span><div class="pair-actions"><button class="invite-primary" id="createInvite" type="button">Создать приглашение</button><button id="shareInvite" type="button" hidden>Поделиться</button><button id="copyInvite" type="button" hidden>Копировать</button></div><input class="invite-link" id="inviteLink" readonly aria-label="Ссылка приглашения"></section>
<details class="filter-menu" id="filterMenu"><summary>Фильтры и сортировка</summary><div class="filter-grid"><input class="filter-search" id="filterQuery" type="search" placeholder="Поиск по желаниям"><select id="filterCategory"><option value="">Все категории</option><option value="home">🏡 Дом</option><option value="clothes">👕 Одежда</option><option value="tech">🎧 Техника</option><option value="beauty">🧴 Красота</option><option value="books">📚 Книги</option><option value="hobby">🎨 Хобби</option><option value="experience">🎟 Впечатления</option><option value="travel">🧳 Путешествия</option><option value="other">Без категории</option></select><input id="filterBudget" inputmode="decimal" placeholder="Бюджет, например 2000 UAH"><select id="filterSort"><option value="priority">Сначала самые желанные</option><option value="newest">Сначала новые</option></select><div class="filter-actions"><button id="resetFilters" type="button">Сбросить</button><button id="applyFilters" class="apply-filter" type="button">Показать</button></div></div></details>
</header>
<main class="grid" id="cards"></main><div class="pager"><button id="prev">← Назад</button><button id="next">Вперёд →</button></div><div class="footer">Сделано с 💚 для нас</div></div>
<div class="add-modal" id="addModal" aria-hidden="true"><div class="add-sheet" role="dialog" aria-modal="true" aria-labelledby="addTitle"><h2 id="addTitle">Добавить желание</h2><div class="add-grid"><input id="wishUrl" inputmode="url" autocomplete="url" placeholder="Вставьте ссылку на товар"><div class="autofill-row"><button id="fillFromLink" type="button">✨ Заполнить по ссылке</button><span class="autofill-status" id="autofillStatus" aria-live="polite"></span></div><div class="product-preview" id="productPreview"><img id="previewImage" alt="Фото товара"><div><strong id="previewTitle"></strong><span id="previewPrice"></span></div></div><input id="wishTitle" maxlength="200" placeholder="Название *"><input id="wishPrice" maxlength="100" placeholder="Цена (необязательно)"><div class="field-row"><input id="wishSize" maxlength="100" placeholder="Размер"><input id="wishColor" maxlength="100" placeholder="Цвет"></div><div class="field-row"><select id="wishScope"><option value="mine">Моё желание</option><option value="shared">Для нас</option></select><select id="wishPriority"><option value="2">❤️ Очень хочу</option><option value="1" selected>💛 Хочу</option><option value="0">🌱 Когда-нибудь</option></select></div><div class="field-row"><select id="wishCategory"><option value="other">Без категории</option><option value="home">🏡 Дом</option><option value="clothes">👕 Одежда</option><option value="tech">🎧 Техника</option><option value="beauty">🧴 Красота</option><option value="books">📚 Книги</option><option value="hobby">🎨 Хобби</option><option value="experience">🎟 Впечатления</option><option value="travel">🧳 Путешествия</option></select><select id="wishMatch"><option value="unspecified">Аналог не указан</option><option value="exact">Только именно это</option><option value="alternative">Можно аналог</option></select></div><textarea id="wishNote" maxlength="1500" placeholder="Комментарий (необязательно)"></textarea></div><div class="add-row"><button id="cancelAdd" class="ghost-btn" type="button">Отмена</button><button id="saveAdd" class="add-btn" type="button">Сохранить</button></div></div></div>
<script>
const query=new URLSearchParams(location.search),session=query.get('session'),apiBase=(query.get('api')||'').replace(/\/$/,''),botLink=query.get('bot')||'';
const state={kind:'mine',page:0,limit:12,query:'',category:'',budget:'',sort:'priority',pendingImage:'',pendingSource:'',metadataRequest:0,metadataTimer:null,editId:null};
const categoryLabels={other:'Без категории',home:'🏡 Дом',clothes:'👕 Одежда',tech:'🎧 Техника',beauty:'🧴 Красота',books:'📚 Книги',hobby:'🎨 Хобби',experience:'🎟 Впечатления',travel:'🧳 Путешествия'};
const nodes={status:document.getElementById('status'),cards:document.getElementById('cards'),prev:document.getElementById('prev'),next:document.getElementById('next'),loaderDot:document.getElementById('loaderDot'),addWish:document.getElementById('addWish'),themeChip:document.getElementById('themeChip'),tabs:[...document.querySelectorAll('.tab')],pairBanner:document.getElementById('pairBanner'),pairText:document.getElementById('pairText'),createInvite:document.getElementById('createInvite'),shareInvite:document.getElementById('shareInvite'),copyInvite:document.getElementById('copyInvite'),inviteLink:document.getElementById('inviteLink'),filterMenu:document.getElementById('filterMenu'),filterQuery:document.getElementById('filterQuery'),filterCategory:document.getElementById('filterCategory'),filterBudget:document.getElementById('filterBudget'),filterSort:document.getElementById('filterSort'),resetFilters:document.getElementById('resetFilters'),applyFilters:document.getElementById('applyFilters'),addModal:document.getElementById('addModal'),addTitle:document.getElementById('addTitle'),wishTitle:document.getElementById('wishTitle'),wishUrl:document.getElementById('wishUrl'),wishPrice:document.getElementById('wishPrice'),wishSize:document.getElementById('wishSize'),wishColor:document.getElementById('wishColor'),wishScope:document.getElementById('wishScope'),wishPriority:document.getElementById('wishPriority'),wishCategory:document.getElementById('wishCategory'),wishMatch:document.getElementById('wishMatch'),wishNote:document.getElementById('wishNote'),cancelAdd:document.getElementById('cancelAdd'),saveAdd:document.getElementById('saveAdd'),fillFromLink:document.getElementById('fillFromLink'),autofillStatus:document.getElementById('autofillStatus'),productPreview:document.getElementById('productPreview'),previewImage:document.getElementById('previewImage'),previewTitle:document.getElementById('previewTitle'),previewPrice:document.getElementById('previewPrice')};
function tryStorageGet(k){try{return localStorage.getItem(k)}catch{return null}}function tryStorageSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function setTheme(theme){const mode=theme==='dark'?'dark':'light';document.documentElement.setAttribute('data-theme',mode);nodes.themeChip.textContent=mode==='dark'?'🌙 Тёмная':'☀️ Светлая';tryStorageSet('wishlist_theme',mode)}
setTheme(tryStorageGet('wishlist_theme')||((window.Telegram?.WebApp?.colorScheme==='dark')?'dark':'light'));nodes.themeChip.addEventListener('click',()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
function setStatus(t){nodes.status.querySelector('span:last-child').textContent=t}function setLoading(on){nodes.loaderDot.style.display=on?'inline-block':'none';nodes.prev.disabled=on||!session;nodes.next.disabled=on||!session;nodes.addWish.disabled=on||!session;nodes.tabs.forEach(b=>b.disabled=on||!session)}function setActiveKind(k){state.kind=k;nodes.tabs.forEach(b=>b.classList.toggle('active',b.dataset.kind===k))}
function showPlaceholder(){nodes.cards.innerHTML='';for(let i=0;i<3;i++){const e=document.createElement('div');e.className='skeleton';nodes.cards.appendChild(e)}}
function createEmptyState(){const w=document.createElement('div');w.className='empty-state';w.innerHTML='<img class="empty-art" src="assets/empty-box-exact.png?v=1" alt="" aria-hidden="true"><strong>Пока ничего не найдено</strong><div class="empty-copy">Добавьте свою первую хотелку — пусть мечты становятся ближе!</div>';const add=document.createElement('button');add.className='add-btn empty-add';add.textContent='＋ Добавить желание';add.addEventListener('click',openAddWish);w.appendChild(add);return w}
function renderCard(card){
  const item=document.createElement('article');item.className='card';
  const media=document.createElement('div');media.className='mediaWrap';
  if(card.image&&!card.image.startsWith('tg:')){const img=document.createElement('img');img.className='photo';img.loading='lazy';img.src=card.image;img.alt=card.title||'Изображение';media.appendChild(img)}else{const ph=document.createElement('div');ph.className='photo-placeholder';ph.textContent='Нет фото';media.appendChild(ph)}
  const sc=document.createElement('span');sc.className='scopeBadge';sc.textContent=card.scope==='shared'?'Для нас':(card.isOwner?'Моё':'Партнёру');media.appendChild(sc);
  if(card.price){const ps=document.createElement('span');ps.className='priceStamp';ps.textContent=card.price;media.appendChild(ps)}
  const body=document.createElement('div');body.className='body';const title=document.createElement('h2');title.textContent=card.title||'Без названия';const owner=document.createElement('p');owner.className='muted';owner.textContent=card.ownerName?`Автор: ${card.ownerName}`:'';const meta=document.createElement('div');meta.className='meta';
  for(const txt of [card.priority===2?'❤️ Очень хочу':card.priority===1?'💛 Хочу':'🌱 Когда-нибудь',categoryLabels[card.category]||categoryLabels.other]){const c=document.createElement('span');c.className='chip';c.textContent=txt;meta.appendChild(c)}
  const details=document.createElement('div');details.className='details';const detail=(label,value)=>{const line=document.createElement('div'),strong=document.createElement('strong');strong.textContent=label+': ';line.append(strong,document.createTextNode(value));details.appendChild(line)};const checked=card.priceChecked?new Date(card.priceChecked).toLocaleDateString('ru-RU'):'';const created=card.created?new Date(card.created).toLocaleDateString('ru-RU'):'';detail('Характеристики',[card.size,card.color].filter(Boolean).join(' · ')||'не указаны');detail('Подойдёт',card.matchMode==='exact'?'Именно это':card.matchMode==='alternative'?'Можно аналог':'Вариант не уточнён');if(card.source||checked)detail('Цена',[card.source,checked&&`проверена ${checked}`].filter(Boolean).join(' · '));if(created)detail('Добавлено',created);
  const note=document.createElement('p');note.className='note';note.textContent=card.note||'Комментарий не добавлен';const more=document.createElement('button');more.textContent='Подробнее';more.addEventListener('click',async()=>{const base=apiBase||`${window.location.origin}/api`;try{const r=await fetch(`${base}/wish/${card.id}?session=${encodeURIComponent(session)}`),d=await r.json();if(r.ok&&d.ok){note.textContent=d.card.note||'Комментарий не добавлен';note.classList.add('expanded');more.style.display='none'}}catch{}});body.append(title,owner,meta,details,note,more);
  const actions=document.createElement('div');actions.className='actions';
  if(card.url){const a=document.createElement('a');a.href=card.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Открыть магазин';actions.appendChild(a)}
  if(card.isOwner){const edit=document.createElement('button');edit.textContent='✏️ Изменить';edit.addEventListener('click',()=>openEditWish(card));const archive=document.createElement('button');archive.textContent=card.archived?'↩ Вернуть':'✓ Сбылось';archive.addEventListener('click',()=>mutateWish(card.id,'archive'));actions.append(edit,archive)}
  else if(state.kind==='partner'&&!card.archived){const claim=document.createElement('button');claim.textContent=card.claimedByMe?'Отменить бронь':'Подарю 🤫';claim.addEventListener('click',()=>mutateWish(card.id,'claim'));actions.appendChild(claim)}
  const badge=document.createElement('button');badge.className='stateBadge';badge.textContent=card.archived?'В архиве':(card.claimedByMe?'Забронировано вами':'В списке');actions.appendChild(badge);item.append(media,body,actions);return item
}
async function requestWishlist(){if(!session)return;setLoading(true);setStatus('Загружаю список…');showPlaceholder();const base=apiBase||`${window.location.origin}/api`,params=new URLSearchParams({session,kind:state.kind,page:String(state.page),limit:String(state.limit),query:state.query,category:state.category,budget:state.budget,sort:state.sort});try{const r=await fetch(`${base}/wishlist?${params}`),d=await r.json();nodes.cards.innerHTML='';if(!r.ok||!d.ok){setStatus(d.error||'Не удалось загрузить желания. Попробуйте снова.');nodes.cards.appendChild(createEmptyState());return}setStatus(`Страница ${d.page+1} · Найдено ${d.count}`);nodes.prev.disabled=d.page===0;nodes.next.disabled=!d.hasMore;if(!d.cards.length)nodes.cards.appendChild(createEmptyState());else d.cards.forEach(c=>nodes.cards.appendChild(renderCard(c)))}catch{setStatus('Не удалось загрузить желания. Попробуйте снова.');nodes.cards.innerHTML='';nodes.cards.appendChild(createEmptyState())}finally{setLoading(false)}}
function applyFilters(){state.query=nodes.filterQuery.value.trim();state.category=nodes.filterCategory.value;state.budget=nodes.filterBudget.value.trim();state.sort=nodes.filterSort.value;state.page=0;nodes.filterMenu.open=false;requestWishlist()}
function resetFilters(){nodes.filterQuery.value='';nodes.filterCategory.value='';nodes.filterBudget.value='';nodes.filterSort.value='priority';applyFilters()}
async function loadPair(){const base=apiBase||`${window.location.origin}/api`;try{const r=await fetch(`${base}/pair?session=${encodeURIComponent(session)}`),d=await r.json();if(r.ok&&d.ok){nodes.pairBanner.classList.toggle('visible',!d.paired);if(d.paired)nodes.pairText.textContent=`Вы в паре с ${d.partnerName||'партнёром'}.`}}catch{}}
async function createInvite(){const base=apiBase||`${window.location.origin}/api`;nodes.createInvite.disabled=true;nodes.pairText.textContent='Создаю одноразовую ссылку…';try{const r=await fetch(`${base}/pair`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,action:'invite'})}),d=await r.json();if(!r.ok||!d.ok){nodes.pairText.textContent=d.error||'Не удалось создать приглашение.';return}nodes.inviteLink.value=d.link;nodes.inviteLink.classList.add('visible');nodes.createInvite.hidden=true;nodes.shareInvite.hidden=false;nodes.copyInvite.hidden=false;nodes.pairText.textContent='Ссылка действует 24 часа и используется один раз.'}catch{nodes.pairText.textContent='Не удалось создать приглашение.'}finally{nodes.createInvite.disabled=false}}
async function copyInvite(){try{await navigator.clipboard.writeText(nodes.inviteLink.value)}catch{nodes.inviteLink.select();document.execCommand('copy')}nodes.copyInvite.textContent='Скопировано ✓'}
async function shareInvite(){const link=nodes.inviteLink.value,text='Присоединяйся к нашему вишлисту 💚';if(navigator.share){try{await navigator.share({title:'OurWishList',text,url:link});return}catch{}}const share=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`;try{window.Telegram?.WebApp?.openTelegramLink?.(share)}catch{location.href=share}}
function openAddWish(){state.editId=null;clearAddForm();nodes.addTitle.textContent='Добавить желание';nodes.wishUrl.disabled=false;nodes.fillFromLink.disabled=false;nodes.addModal.classList.add('open');nodes.addModal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';nodes.wishUrl.focus()}function closeAddWish(){nodes.addModal.classList.remove('open');nodes.addModal.setAttribute('aria-hidden','true');document.body.style.overflow=''}
async function openEditWish(card){const base=apiBase||`${window.location.origin}/api`;nodes.addTitle.textContent='Загружаю желание…';nodes.addModal.classList.add('open');nodes.addModal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';try{const r=await fetch(`${base}/wish/${card.id}?session=${encodeURIComponent(session)}`),d=await r.json();if(!r.ok||!d.ok)throw new Error();const full=d.card;state.editId=card.id;state.pendingImage=full.image||'';state.pendingSource=full.source||'';nodes.addTitle.textContent='Изменить желание';nodes.wishUrl.value=full.url||'';nodes.wishUrl.disabled=true;nodes.fillFromLink.disabled=true;nodes.wishTitle.value=full.title||'';nodes.wishPrice.value=full.price||'';nodes.wishSize.value=full.size||'';nodes.wishColor.value=full.color||'';nodes.wishScope.value=full.scope||'mine';nodes.wishPriority.value=String(full.priority??1);nodes.wishCategory.value=full.category||'other';nodes.wishMatch.value=full.matchMode||'unspecified';nodes.wishNote.value=full.note||'';nodes.autofillStatus.textContent='';if(state.pendingImage&&!state.pendingImage.startsWith('tg:')){nodes.previewImage.src=state.pendingImage;nodes.previewTitle.textContent=full.title||'';nodes.previewPrice.textContent=full.price||'';nodes.productPreview.classList.add('visible')}else nodes.productPreview.classList.remove('visible');nodes.wishTitle.focus()}catch{closeAddWish();alert('Не удалось открыть желание для редактирования')}}
function resetProductPreview(){state.pendingImage='';state.pendingSource='';nodes.productPreview.classList.remove('visible');nodes.previewImage.removeAttribute('src');nodes.previewTitle.textContent='';nodes.previewPrice.textContent=''}
async function autofillWish(){const url=nodes.wishUrl.value.trim();if(!url){nodes.autofillStatus.textContent='Сначала вставьте ссылку.';nodes.wishUrl.focus();return}const request=++state.metadataRequest,base=apiBase||`${window.location.origin}/api`;nodes.fillFromLink.disabled=true;nodes.autofillStatus.textContent='Получаю данные товара…';resetProductPreview();try{const r=await fetch(`${base}/metadata`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,url})}),d=await r.json();if(request!==state.metadataRequest)return;if(!r.ok||!d.ok){nodes.autofillStatus.textContent=d.error||'Не удалось заполнить автоматически.';return}nodes.wishUrl.value=d.url||url;if(d.title)nodes.wishTitle.value=d.title;if(d.price)nodes.wishPrice.value=d.price;state.pendingImage=d.image||'';state.pendingSource=d.source||'';nodes.previewTitle.textContent=d.title||'Товар по ссылке';nodes.previewPrice.textContent=d.price||'Цена не найдена';if(state.pendingImage){nodes.previewImage.src=state.pendingImage;nodes.productPreview.classList.add('visible')}nodes.autofillStatus.textContent='Готово — проверьте данные перед сохранением.'}catch{if(request===state.metadataRequest)nodes.autofillStatus.textContent='Магазин недоступен. Заполните карточку вручную.'}finally{if(request===state.metadataRequest)nodes.fillFromLink.disabled=false}}
function clearAddForm(){clearTimeout(state.metadataTimer);nodes.wishTitle.value='';nodes.wishUrl.value='';nodes.wishPrice.value='';nodes.wishSize.value='';nodes.wishColor.value='';nodes.wishScope.value='mine';nodes.wishPriority.value='1';nodes.wishCategory.value='other';nodes.wishMatch.value='unspecified';nodes.wishNote.value='';nodes.autofillStatus.textContent='Вставьте ссылку — данные загрузятся автоматически.';resetProductPreview()}
function wishPayload(){return{session,title:nodes.wishTitle.value.trim(),url:nodes.wishUrl.value.trim(),image:state.pendingImage,source:state.pendingSource,price:nodes.wishPrice.value.trim(),size:nodes.wishSize.value.trim(),color:nodes.wishColor.value.trim(),scope:nodes.wishScope.value,priority:Number(nodes.wishPriority.value),category:nodes.wishCategory.value,matchMode:nodes.wishMatch.value,note:nodes.wishNote.value.trim()}}
async function saveWish(){const payload=wishPayload();if(!payload.title){nodes.wishTitle.focus();return}const base=apiBase||`${window.location.origin}/api`,editing=state.editId!==null;if(editing){payload.id=state.editId;payload.action='update'}nodes.saveAdd.disabled=true;try{const r=await fetch(`${base}/wish`,{method:editing?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();if(!r.ok||!d.ok){alert(d.error||(editing?'Не удалось изменить желание':'Не удалось добавить желание'));return}clearAddForm();closeAddWish();state.editId=null;if(!editing){state.kind=payload.scope==='shared'?'shared':'mine';state.page=0;setActiveKind(state.kind);if(d.created===false)alert('Это желание уже есть в вашем списке. Открываю существующую карточку.')}requestWishlist()}catch{alert('Не удалось связаться с сервером')}finally{nodes.saveAdd.disabled=false}}
async function mutateWish(id,action){const base=apiBase||`${window.location.origin}/api`;setLoading(true);try{const r=await fetch(`${base}/wish`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({session,id,action})}),d=await r.json();if(!r.ok||!d.ok){alert(d.error||'Не удалось обновить желание');return}await requestWishlist()}catch{alert('Не удалось связаться с сервером')}finally{setLoading(false)}}
nodes.tabs.forEach(b=>b.addEventListener('click',()=>{setActiveKind(b.dataset.kind);state.page=0;requestWishlist()}));nodes.prev.addEventListener('click',()=>{if(state.page>0){state.page--;requestWishlist()}});nodes.next.addEventListener('click',()=>{state.page++;requestWishlist()});nodes.applyFilters.addEventListener('click',applyFilters);nodes.resetFilters.addEventListener('click',resetFilters);nodes.filterQuery.addEventListener('keydown',e=>{if(e.key==='Enter')applyFilters()});nodes.createInvite.addEventListener('click',createInvite);nodes.copyInvite.addEventListener('click',copyInvite);nodes.shareInvite.addEventListener('click',shareInvite);nodes.addWish.addEventListener('click',openAddWish);nodes.cancelAdd.addEventListener('click',closeAddWish);nodes.saveAdd.addEventListener('click',saveWish);nodes.fillFromLink.addEventListener('click',()=>{clearTimeout(state.metadataTimer);autofillWish()});nodes.wishUrl.addEventListener('input',()=>{clearTimeout(state.metadataTimer);state.metadataRequest++;nodes.autofillStatus.textContent='';resetProductPreview();if(/^https?:\/\//i.test(nodes.wishUrl.value.trim()))state.metadataTimer=setTimeout(autofillWish,650)});nodes.addModal.addEventListener('click',e=>{if(e.target===nodes.addModal)closeAddWish()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&nodes.addModal.classList.contains('open'))closeAddWish()});
try{window.Telegram?.WebApp?.ready?.();window.Telegram?.WebApp?.expand?.()}catch{}if(session){requestWishlist();loadPair()}else{setStatus('Сначала откройте приложение через кнопку в боте.');setLoading(false)}
</script>
</body>
